name: Cockpit Sync

# Every 30 minutes (public repo → free unlimited Actions minutes). GitHub's
# scheduler is best-effort; real cadence is ~30-45 min. Prices/news refresh each run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Execute cockpit pipeline
        env:
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY:         ${{ secrets.TAVILY_API_KEY }}
          FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
          SPOTIFY_CLIENT_ID:      ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:  ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN:  ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GCAL_ICS_URL:           ${{ secrets.GCAL_ICS_URL }}
          COCKPIT_NOTE_URL:       ${{ secrets.COCKPIT_NOTE_URL }}
        run: python engine/cockpit_worker.py

      - name: Commit refreshed data contract
        run: |
          git config user.name  "cockpit-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "cockpit: refresh intelligence payload"
            git push
          else
            echo "data.json unchanged — nothing to deploy"
          fi
