name: Cockpit Sync

# Twice daily in WIB: 06:00 (23:00 UTC prev day) and 18:00 (11:00 UTC).
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Execute cockpit pipeline
        env:
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          GCAL_ICS_URL:       ${{ secrets.GCAL_ICS_URL }}
          COCKPIT_NOTE_URL:   ${{ secrets.COCKPIT_NOTE_URL }}
        run: python engine/cockpit_worker.py

      - name: Commit refreshed data contract
        run: |
          git config user.name  "cockpit-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "cockpit: refresh intelligence payload"
            git push
          else
            echo "data.json unchanged — nothing to deploy"
          fi
