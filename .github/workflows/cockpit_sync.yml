name: Cockpit Sync

# Triggered every 30 min by cron-job.org via the GitHub API (workflow_dispatch).
# The GitHub-native */30 schedule was removed to avoid double-firing — cron-job.org
# is now the single reliable trigger. Prices/news refresh each run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Execute cockpit pipeline
        env:
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY:         ${{ secrets.TAVILY_API_KEY }}
          FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
          SPOTIFY_CLIENT_ID:      ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:  ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN:  ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GCAL_ICS_URL:           ${{ secrets.GCAL_ICS_URL }}
          COCKPIT_NOTE_URL:       ${{ secrets.COCKPIT_NOTE_URL }}
        run: python engine/cockpit_worker.py

      - name: Commit refreshed data contract
        run: |
          git config user.name  "cockpit-bot"
          git config user.email "actions@github.com"
          if git diff --quiet data.json; then
            echo "data.json unchanged — nothing to deploy"
            exit 0
          fi
          git add data.json
          git commit -m "cockpit: refresh intelligence payload"
          # Retry with rebase so a concurrent push (manual or another run) can't fail us.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i failed — rebasing & retrying"; sleep 4
          done
          echo "::error::could not push data.json after retries"; exit 1
